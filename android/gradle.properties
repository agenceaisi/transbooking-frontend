org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin 2.3.x (Build Tools API daemon) plante sous Windows en fermant ses caches
# incrémentaux (« Could not close incremental caches / Storage already registered »).
# On désactive la compilation incrémentale de Kotlin : ces caches .tab ne sont plus
# créés, le chemin de code qui plante disparaît. Coût négligeable (plugins stables).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
